name: Release

# 推送 v* 标签时构建双模式单文件，并创建带产物附件的 GitHub Release。
# 与 deploy-pages.yml 互不冲突：Release 发布后该工作流会自动部署一次 Pages。
on:
  push:
    tags: ['v*']

# 创建 Release 并上传附件需要 contents 写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file artifacts
        run: npm run build:all

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/index.html
            dist/index.cdn.html
