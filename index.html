<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D房屋</title>
</head>
<body>
    <div id="ui-container">
        <!-- 楼层按钮组：收起态只显示「当前楼层」图标，点击竖向弹出 4 个楼层待选项 -->
        <div class="btn-group" id="floor-group">
            <button id="btn-floor-main" class="btn btn-floor btn-floor-main" title="楼层" aria-label="楼层" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                    <rect class="slab on" x="4" y="9.5" width="16" height="5" rx="1"/>
                </svg>
            </button>
            <div class="btn-pop" id="floor-pop" role="menu">
                <button class="btn btn-floor pop-item" data-floor="0" title="1F" aria-label="1F">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                        <rect class="slab on" x="4" y="9.5" width="16" height="5" rx="1"/>
                    </svg>
                    <span class="pop-label">1F</span>
                </button>
                <button class="btn btn-floor pop-item" data-floor="1" title="2F" aria-label="2F">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                        <rect class="slab on" x="4" y="5.75" width="16" height="5" rx="1"/>
                        <rect class="slab" x="4" y="13.25" width="16" height="5" rx="1"/>
                    </svg>
                    <span class="pop-label">2F</span>
                </button>
                <button class="btn btn-floor pop-item" data-floor="2" title="3F" aria-label="3F">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                        <rect class="slab on" x="4" y="2" width="16" height="5" rx="1"/>
                        <rect class="slab" x="4" y="9.5" width="16" height="5" rx="1"/>
                        <rect class="slab" x="4" y="17" width="16" height="5" rx="1"/>
                    </svg>
                    <span class="pop-label">3F</span>
                </button>
                <button id="btn-floor-4" class="btn btn-floor pop-item" data-floor="3" title="屋顶" aria-label="屋顶">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                        <path class="roof" d="M2 9 L12 2.5 L22 9 Z"/>
                        <rect class="slab" x="4" y="12.5" width="16" height="9" rx="1"/>
                    </svg>
                    <span class="pop-label">屋顶</span>
                </button>
            </div>
        </div>

        <span class="btn-divider" aria-hidden="true"></span>

        <!-- 视角模式按钮组：收起态只显示「当前模式」图标，点击竖向弹出 4 个模式待选项 -->
        <div class="btn-group" id="mode-group">
            <button id="btn-mode-main" class="btn btn-mode-main" title="视角" aria-label="视角" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12 C5 6.5 19 6.5 22 12 C19 17.5 5 17.5 2 12 Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
            <div class="btn-pop" id="mode-pop" role="menu">
                <button class="btn pop-item" data-mode="tps" title="上帝视角" aria-label="上帝视角">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12 C5 6.5 19 6.5 22 12 C19 17.5 5 17.5 2 12 Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span class="pop-label">上帝视角</span>
                </button>
                <button class="btn pop-item" data-mode="fps" title="第一人称漫游" aria-label="第一人称漫游">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="5" r="2.5"/>
                        <path d="M12 8 v6 M12 10.5 l-4.5 2.5 M12 10.5 l4.5 2.5 M12 14 l-3 7 M12 14 l3 7"/>
                    </svg>
                    <span class="pop-label">第一人称</span>
                </button>
                <button class="btn pop-item" data-mode="2d" title="2D 平面尺寸图" aria-label="2D 平面尺寸图">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="1"/>
                        <path d="M4 12 h16 M12 4 v16"/>
                    </svg>
                    <span class="pop-label">2D 尺寸图</span>
                </button>
                <button class="btn pop-item" data-mode="game" title="游戏模式" aria-label="游戏模式">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="6"/>
                        <path d="M6 12 h4 M8 10 v4"/>
                        <circle cx="15.5" cy="11.5" r="0.9" fill="currentColor" stroke="none"/>
                        <circle cx="18" cy="13.5" r="0.9" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="pop-label">游戏模式</span>
                </button>
            </div>
        </div>

        <button id="btn-minimap" class="btn" title="小地图" aria-label="小地图" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3 L3 6 V21 L9 18 L15 21 L21 18 V3 L15 6 Z"/>
                <path d="M9 3 V18 M15 6 V21"/>
                <circle cx="15" cy="9" r="1.6" fill="currentColor" stroke="none"/>
            </svg>
        </button>
        <button id="btn-add-dim" class="btn btn-measure" title="+ 添加标注" aria-label="添加标注" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8 v8 M8 12 h8"/>
            </svg>
        </button>
    </div>
    <div id="measure-tip">请在画布上点击两个点进行测量...</div>
    <div id="info">WASD移动 | 拖拽鼠标看四周 | 点击门窗开关 | 滚轮缩放(上帝视角)</div>

    <!-- 第一人称虚拟操作簇：左半屏触控自动显现、松手隐藏（游戏 + 漫游通用） -->
    <div id="touch-cluster">
      <div id="joystick"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
      <button id="btn-jump" class="tc-btn tc-jump" type="button">跳</button>
      <button id="btn-fire" class="tc-btn tc-game-only tc-fire" type="button">射击</button>
      <button id="btn-reload" class="tc-btn tc-game-only tc-reload" type="button">换弹</button>
      <button id="btn-cycle-prev" class="tc-btn tc-game-only tc-cycle" type="button">◀</button>
      <button id="btn-cycle-next" class="tc-btn tc-game-only tc-cycle" type="button">▶</button>
    </div>

    <canvas id="floorplan-canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
