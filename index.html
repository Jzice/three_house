<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D房屋</title>
</head>
<body>
    <div id="ui-container">
        <!-- 楼层：叠层图标，实心块标记该按钮对应的楼层（最上一块），下方各层空心；
             三个图标共用同一套几何：矩形 16×5、x=4（垂直对齐）、层间距 2.5（等距），
             且每个图标整体在 24×24 画布内垂直居中（与按钮正中对齐） -->
        <button id="btn-floor-1" class="btn btn-floor" title="1F" aria-label="1F">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                <rect class="slab on" x="4" y="9.5" width="16" height="5" rx="1"/>
            </svg>
        </button>
        <button id="btn-floor-2" class="btn btn-floor" title="2F" aria-label="2F">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                <rect class="slab on" x="4" y="5.75" width="16" height="5" rx="1"/>
                <rect class="slab" x="4" y="13.25" width="16" height="5" rx="1"/>
            </svg>
        </button>
        <button id="btn-floor-3" class="btn btn-floor" title="3F" aria-label="3F">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                <rect class="slab on" x="4" y="2" width="16" height="5" rx="1"/>
                <rect class="slab" x="4" y="9.5" width="16" height="5" rx="1"/>
                <rect class="slab" x="4" y="17" width="16" height="5" rx="1"/>
            </svg>
        </button>
        <button id="btn-floor-4" class="btn" title="屋顶" aria-label="屋顶">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                <path d="M3 17 L12 7 L21 17"/>
                <path d="M6 17 h12"/>
            </svg>
        </button>

        <span class="btn-divider" aria-hidden="true"></span>

        <!-- 视角模式 -->
        <button id="btn-tps" class="btn" title="上帝视角" aria-label="上帝视角">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12 C5 6.5 19 6.5 22 12 C19 17.5 5 17.5 2 12 Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
        <button id="btn-fps" class="btn" title="第一人称漫游" aria-label="第一人称漫游">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2.5"/>
                <path d="M12 8 v6 M12 10.5 l-4.5 2.5 M12 10.5 l4.5 2.5 M12 14 l-3 7 M12 14 l3 7"/>
            </svg>
        </button>
        <button id="btn-2d" class="btn" title="2D 平面尺寸图" aria-label="2D 平面尺寸图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="1"/>
                <path d="M4 12 h16 M12 4 v16"/>
            </svg>
        </button>
        <button id="btn-minimap" class="btn" title="小地图" aria-label="小地图" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3 L3 6 V21 L9 18 L15 21 L21 18 V3 L15 6 Z"/>
                <path d="M9 3 V18 M15 6 V21"/>
                <circle cx="15" cy="9" r="1.6" fill="currentColor" stroke="none"/>
            </svg>
        </button>
        <button id="btn-add-dim" class="btn btn-measure" title="+ 添加标注" aria-label="添加标注" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8 v8 M8 12 h8"/>
            </svg>
        </button>
    </div>
    <div id="measure-tip">请在画布上点击两个点进行测量...</div>
    <div id="info">WASD移动 | 拖拽鼠标看四周 | 点击门窗开关 | 滚轮缩放(上帝视角)</div>

    <!-- 触屏虚拟摇杆：仅第一人称 + 触屏设备显示（由 main.ts 控制显隐） -->
    <div id="joystick" class="touch-only">
        <div id="joystick-base"><div id="joystick-knob"></div></div>
    </div>

    <canvas id="floorplan-canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
